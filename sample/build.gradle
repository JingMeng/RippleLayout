apply plugin: 'com.android.application'

android {
    namespace 'com.southernbox.ripplelayout'
    compileSdk 34

    defaultConfig {
        applicationId "com.southernbox.ripplelayout"
        minSdk 15
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation project(':ripplelayout')
}




